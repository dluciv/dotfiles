{{- $current_scheme_name := joinPath .abs_appdata_dir "tinted-theming" "tinty" "current_scheme" | include | replace "base24-" "base24/" | replace "base16-" "base16/" -}}
{{- $current_scheme_yaml_path := print (joinPath .abs_appdata_dir "tinted-theming" "tinty" "repos" "schemes" $current_scheme_name) ".yaml"  -}}
{{- $current_scheme_data := include $current_scheme_yaml_path | fromYaml -}}
{{- $p := $current_scheme_data.palette -}}
# This is current theme from tinty's repos stealed and processed
base00: &base00 "{{ $p.base00 | trimPrefix "#" }}"
base01: &base01 "{{ $p.base01 | trimPrefix "#" }}"
base02: &base02 "{{ $p.base02 | trimPrefix "#" }}"
base03: &base03 "{{ $p.base03 | trimPrefix "#" }}"
base04: &base04 "{{ $p.base04 | trimPrefix "#" }}"
base05: &base05 "{{ $p.base05 | trimPrefix "#" }}"
base06: &base06 "{{ $p.base06 | trimPrefix "#" }}"
base07: &base07 "{{ $p.base07 | trimPrefix "#" }}"
base08: &base08 "{{ $p.base08 | trimPrefix "#" }}"
base09: &base09 "{{ $p.base09 | trimPrefix "#" }}"
base0A: &base0A "{{ $p.base0A | trimPrefix "#" }}"
base0B: &base0B "{{ $p.base0B | trimPrefix "#" }}"
base0C: &base0C "{{ $p.base0C | trimPrefix "#" }}"
base0D: &base0D "{{ $p.base0D | trimPrefix "#" }}"
base0E: &base0E "{{ $p.base0E | trimPrefix "#" }}"
base0F: &base0F "{{ $p.base0F | trimPrefix "#" }}"
base10: &base10 "{{ $p.base10 | trimPrefix "#" }}"
base11: &base11 "{{ $p.base11 | trimPrefix "#" }}"
base12: &base12 "{{ $p.base12 | trimPrefix "#" }}"
base13: &base13 "{{ $p.base13 | trimPrefix "#" }}"
base14: &base14 "{{ $p.base14 | trimPrefix "#" }}"
base15: &base15 "{{ $p.base15 | trimPrefix "#" }}"
base16: &base16 "{{ $p.base16 | trimPrefix "#" }}"
base17: &base17 "{{ $p.base17 | trimPrefix "#" }}"

# ANSI terminal colors, per the standard Base24 -> ANSI mapping.
# Each entry reuses the baseXX color defined above (YAML alias).
# regular:
ansi0: *base00  # ANSI Black          = base00
ansi1: *base08  # ANSI Red            = base08
ansi2: *base0B  # ANSI Green          = base0B
ansi3: *base0A  # ANSI Yellow         = base0A
ansi4: *base0D  # ANSI Blue           = base0D
ansi5: *base0E  # ANSI Magenta        = base0E
ansi6: *base0C  # ANSI Cyan           = base0C
ansi7: *base05  # ANSI White          = base05
# bright:
ansi8: *base03  # ANSI Bright Black   = base03
ansi9: *base12  # ANSI Bright Red     = base12
ansiA: *base14  # ANSI Bright Green   = base14
ansiB: *base13  # ANSI Bright Yellow  = base13
ansiC: *base16  # ANSI Bright Blue    = base16
ansiD: *base17  # ANSI Bright Magenta = base17
ansiE: *base15  # ANSI Bright Cyan    = base15
ansiF: *base07  # ANSI Bright White   = base07
