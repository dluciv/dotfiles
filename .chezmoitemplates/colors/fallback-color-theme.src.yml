scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  name: "VGA BIOS"
  author: "IBM VGA Standard"
variant: "dark"
palette:
  # ANSI 0–7 (normal)
  black: "#000000"
  red: "#aa0000"
  green: "#00aa00"
  yellow: "#aa5500"
  blue: "#0000aa"
  magenta: "#aa00aa"
  cyan: "#00aaaa"
  white: "#aaaaaa"
  # ANSI 8–15 (bright)
  black-bright: "#555555"
  red-bright: "#ff5555"
  green-bright: "#55ff55"
  yellow-bright: "#ffff55"
  blue-bright: "#5555ff"
  magenta-bright: "#ff55ff"
  cyan-bright: "#55ffff"
  white-bright: "#ffffff"